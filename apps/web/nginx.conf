# Serves the web app's static build. The Dockerfile installs this file as
# /etc/nginx/conf.d/default.conf of nginxinc/nginx-unprivileged, so it sits
# inside that image's http block, which already sets the MIME types and logs
# to stdout/stderr.
#
# The app calls the API on the same origin under /api; the ingress routes
# those requests to the api, not to this server.

# Vite names everything in /assets/ after a hash of its content, so a file
# there never changes and browsers may keep it for a year. Everything else,
# above all index.html, which names the current build's assets, is
# revalidated on every load.
map $uri $web_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/web;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml;

    # Keep every add_header in this block: a location with an add_header of
    # its own would drop all of these.
    add_header Cache-Control $web_cache_control;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # SPA fallback: any path that isn't a file gets the app, which renders it.
    location / {
        try_files $uri /index.html;
    }

    # A missing asset (say, a chunk of an older build) is a 404, not the app's
    # HTML served in place of JavaScript.
    location /assets/ {
        try_files $uri =404;
    }

    # API requests only get here if the ingress misroutes them; a 404 says so
    # more clearly than index.html in place of JSON.
    location /api/ {
        return 404;
    }

    # Liveness and readiness probes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
