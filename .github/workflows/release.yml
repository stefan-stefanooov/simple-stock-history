name: Release

# Pushing a vX.Y.Z tag publishes both images to GHCR, tagged X.Y.Z. Steps:
# docs/releasing.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

# Pushing the same tag again waits for the run in progress instead of racing it
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Publish ${{ matrix.app }} image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One image failing must not leave the other half-published unnoticed:
      # both run to the end and the run goes red if either fails.
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag without its v (v1.2.3 → 1.2.3) is the only image tag: the
      # homelab pins exact versions, so there is no latest. The OCI labels
      # include source, revision (the tagged commit) and version.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/stock-history-${{ matrix.app }}
          flavor: latest=false
          tags: type=semver,pattern={{version}}
          labels: org.opencontainers.image.title=stock-history-${{ matrix.app }}

      # Reuses the layer cache the CI image builds keep warm on main
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}-image
